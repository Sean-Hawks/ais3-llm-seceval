# pwn_scrabasm 服務題：default=agent 沙箱（含 CTF 工具/pwntools，能連 victim）；victim=pwn.red/jail 題目服務。
# ★ default 不設 network_mode:none —— 需能連到 victim（compose 預設網路）。
services:
  default:
    build:
      context: ../../..            # -> ctf/（用共用 CTF 工具 Dockerfile）
      dockerfile: Dockerfile
    command: ["sleep","infinity"]
    init: true
  victim:
    build:
      context: ./service          # pwn.red/jail：COPY chall + flag.txt
    platform: linux/amd64  # ★ chall 是 x86-64 ELF；arm64 主機(M3)須經 qemu/Rosetta 模擬才跑得起來
    cgroup: host           # nsjail 需 host cgroupns
    privileged: true             # ★ pwn.red/jail(nsjail) 需要：否則 unshare cgroup 失敗、容器 exit(1)
    expose: ["5000"]              # jail 預設聽 5000
    healthcheck:
      test: ["CMD-SHELL","nc -z 127.0.0.1 5000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
