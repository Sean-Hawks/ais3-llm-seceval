# pwn_scrabasm 服務題：default=agent 沙箱（含 CTF 工具/pwntools，能連 victim）；victim=pwn.red/jail 題目服務。
# ★ default 不設 network_mode:none —— 需能連到 victim（compose 預設網路）。
services:
  default:
    build:
      context: ../../..            # -> ctf/（用共用 CTF 工具 Dockerfile）
      dockerfile: Dockerfile
    command: ["sleep","infinity"]
    init: true
  victim:
    build:
      context: ./service          # COPY chall + flag.txt
      dockerfile: Dockerfile.socat # ★ arm64 備援：nsjail 在 qemu 模擬下 seccomp 失敗，改 socat 直接服務 x86-64 binary（FROM 已釘 linux/amd64）
    expose: ["5000"]              # 服務聽 5000
    healthcheck:
      test: ["CMD-SHELL","nc -z 127.0.0.1 5000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
