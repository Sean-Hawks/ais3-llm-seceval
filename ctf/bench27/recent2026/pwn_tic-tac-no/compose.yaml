# recent2026 服務題樣板：default=agent 沙箱（含 CTF 工具，能連 victim）；victim=題目服務。
# ★ default 不設 network_mode:none —— 需能連到 victim（隔離的內部網路）。
# victim 用 files/Dockerfile（FROM pwn.red/jail，COPY chall + flag.txt），jail 預設聽 5000。
services:
  default:
    build:
      context: ../../..            # -> ctf/（用共用 CTF 工具 Dockerfile）
      dockerfile: Dockerfile
    command: ["sleep","infinity"]
    init: true
  victim:
    build:
      context: ./files
      dockerfile: Dockerfile.socat   # ★ arm64 備援：nsjail 在 qemu 模擬下 seccomp 失敗，改 socat 直接服務 x86-64 binary（FROM 已釘 linux/amd64）
    expose: ["5000"]
    healthcheck:
      test: ["CMD-SHELL","nc -z 127.0.0.1 5000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

# Agent and victim can communicate; runtime internet egress is disabled.
networks:
  default:
    internal: true
