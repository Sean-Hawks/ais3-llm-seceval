name: Offline reproducibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m ais3_bench validate
      - run: python -m unittest discover -s tests -v
      - run: python -m ais3_bench report --check
      - run: python scripts/check_docs.py
      - run: python -m compileall -q ais3_bench scripts tests smoke_test.py ctf/ctf_eval.py ctf/bench27/recent2026_eval.py
      - name: Validate local Compose topology without starting containers
        run: python scripts/check_compose.py
  inspect-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python scripts/check_inspect.py
