name: Offline reproducibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m ais3_bench validate
      - run: python -m unittest discover -s tests -v
      - run: python -m ais3_bench report --check
      - run: python scripts/check_docs.py
      - run: python -m compileall -q ais3_bench scripts tests smoke_test.py ctf/ctf_eval.py ctf/bench27/recent2026_eval.py
      - name: Validate local Compose topology without starting containers
        run: python scripts/check_compose.py
  inspect-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python scripts/check_inspect.py
